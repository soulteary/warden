openapi: 3.1.0
info:
  title: Warden API
  description: |
    一个高性能的允许列表（AllowList）用户数据服务，支持本地和远程配置源的数据同步与合并。
    
    ## 核心特性
    - 高性能：支持每秒 5000+ 请求
    - 多数据源：支持本地配置文件和远程 API 两种数据源
    - 灵活策略：提供 7 种数据合并模式
    - 定时更新：每个副本独立刷新本地快照，Redis 分布式锁仅协调共享缓存写入
    - 容器化部署：完整的 Docker 支持
  version: 1.2.0
  contact:
    name: Warden Project
    url: https://github.com/soulteary/warden
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: http://localhost:8081
    description: 本地开发服务器
  - url: https://api.example.com
    description: 生产环境服务器

security:
  - APIKeyHeader: []
  - BearerAuth: []
  - HMACSignature: []
    HMACTimestamp: []
    HMACKeyID: []
    HMACNonce: []
    HMACVersion: []
  - MutualTLS: []

tags:
  - name: users
    description: 用户数据相关接口
  - name: health
    description: 健康检查相关接口
  - name: system
    description: 系统管理相关接口

paths:
  /:
    get:
      tags:
        - users
      summary: 获取用户列表
      description: |
        获取允许列表中的所有用户数据。支持分页查询。
        
        - 如果不提供分页参数，返回完整的用户数组（向后兼容）
        - 如果提供分页参数（page, page_size），返回分页格式的响应
      operationId: getUsers
      parameters:
        - name: page
          in: query
          description: 页码（从 1 开始）
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000000
            default: 1
        - name: page_size
          in: query
          description: 每页大小
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        '200':
          description: 成功返回用户列表
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/AllowListUser'
                    description: 无分页参数时返回的格式
                  - $ref: '#/components/schemas/PaginatedUsers'
                    description: 有分页参数时返回的格式
              examples:
                no_pagination:
                  summary: 无分页响应示例
                  value:
                    - phone: "13800138000"
                      mail: "admin@example.com"
                      user_id: "a1b2c3d4e5f6g7h8"
                      status: "active"
                      scope: ["read", "write"]
                      role: "admin"
                      name: "管理员"
                    - phone: "13900139000"
                      mail: "user@example.com"
                      user_id: "b2c3d4e5f6g7h8i9"
                      status: "active"
                      scope: ["read"]
                      role: "user"
                with_pagination:
                  summary: 分页响应示例
                  value:
                    data:
                      - phone: "13800138000"
                        mail: "admin@example.com"
                        user_id: "a1b2c3d4e5f6g7h8"
                        status: "active"
                        scope: ["read", "write"]
                        role: "admin"
                        name: "管理员"
                      - phone: "13900139000"
                        mail: "user@example.com"
                        user_id: "b2c3d4e5f6g7h8i9"
                        status: "active"
                        scope: ["read"]
                        role: "user"
                    pagination:
                      page: 1
                      page_size: 100
                      total: 2
                      total_pages: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /data.json:
    get:
      tags:
        - users
      summary: 获取用户列表（data.json 别名）
      description: |
        与 GET / 行为、认证、分页及响应格式完全一致。
        返回合并后的用户数据 JSON，便于作为 data.json API 供下游或编辑器消费。
      operationId: getUsersDataJson
      parameters:
        - name: page
          in: query
          description: 页码（从 1 开始）
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000000
            default: 1
        - name: page_size
          in: query
          description: 每页大小
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        '200':
          description: 成功返回用户列表（与 GET / 相同）
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/AllowListUser'
                  - $ref: '#/components/schemas/PaginatedUsers'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /health:
    get:
      security: []
      tags:
        - health
      summary: 健康检查
      description: |
        检查 Redis、数据缓存、快照来源与快照新鲜度。
        
        响应内容会根据 `ENVIRONMENT` 有所不同：
        - production：只返回 `status` 与 `service`
        - development/test：额外返回 `checks`、时间戳和耗时

        `degraded` 仍返回 200；关键检查失败时返回 503。严格远程模式
        (`REMOTE_FIRST` / `ONLY_REMOTE`) 会把未知或超过 `SNAPSHOT_MAX_AGE`
        的快照视为关键失败。
      operationId: healthCheck
      responses:
        '200':
          description: 服务健康
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'
              examples:
                healthy:
                  summary: 健康状态示例
                  value:
                    status: "ok"
                    service: "warden"
                    checks:
                      redis:
                        name: "redis"
                        status: "ok"
                        latency_ms: 1
                        timestamp: "2026-08-31T00:00:00Z"
                      snapshot:
                        name: "snapshot"
                        status: "ok"
                        latency_ms: 0
                        timestamp: "2026-08-31T00:00:00Z"
                        metadata:
                          source: "merged"
                          version: "a1b2c3d4"
                          age_seconds: 2.5
                degraded:
                  summary: 使用本地回退快照
                  value:
                    status: "degraded"
                    service: "warden"
        '503':
          description: 服务不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'
        '403':
          description: 客户端 IP 不在 `HEALTH_CHECK_IP_WHITELIST` 中

  /healthcheck:
    get:
      security: []
      tags:
        - health
      summary: 健康检查（别名）
      description: /health 端点的别名，功能完全相同
      operationId: healthCheckAlias
      responses:
        '200':
          $ref: '#/paths/~1health/get/responses/200'
        '503':
          $ref: '#/paths/~1health/get/responses/503'

  /log/level:
    get:
      tags:
        - system
      summary: 获取当前日志级别
      description: 查询当前服务的日志级别
      operationId: getLogLevel
      responses:
        '200':
          description: 成功返回日志级别
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogLevelResponse'
              example:
                level: "info"
    post:
      tags:
        - system
      summary: 设置日志级别
      description: |
        动态调整服务的日志级别。
        
        支持的级别：trace, debug, info, warn, error, fatal, panic
      operationId: setLogLevel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogLevelRequest'
            example:
              level: "debug"
      responses:
        '200':
          description: 日志级别更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogLevelUpdateResponse'
              example:
                message: "日志级别已更新"
                level: "debug"
        '400':
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_body:
                  summary: 无效的请求体
                  value:
                    error: "无效的请求体"
                invalid_level:
                  summary: 无效的日志级别
                  value:
                    error: "无效的日志级别，支持: trace, debug, info, warn, error, fatal, panic"
        '405':
          description: 不支持的 HTTP 方法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "不支持的方法，请使用 GET 或 POST"

  /user:
    get:
      tags:
        - users
      summary: 查询单个用户
      description: |
        根据标识符查询单个用户信息。支持通过手机号、邮箱或用户ID查询。

        注意：只能提供一个查询参数（phone、mail 或 user_id）。
      operationId: getUserByIdentifier
      parameters:
        - name: phone
          in: query
          description: 用户手机号
          required: false
          schema:
            type: string
            example: "13800138000"
        - name: mail
          in: query
          description: 用户邮箱
          required: false
          schema:
            type: string
            format: email
            example: "admin@example.com"
        - name: user_id
          in: query
          description: 用户唯一标识符
          required: false
          schema:
            type: string
            example: "a1b2c3d4e5f6g7h8"
      responses:
        '200':
          description: 成功返回用户信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllowListUser'
              example:
                phone: "13800138000"
                mail: "admin@example.com"
                user_id: "a1b2c3d4e5f6g7h8"
                status: "active"
                scope: ["read", "write"]
                role: "admin"
                name: "管理员"
        '400':
          description: 请求参数错误（缺少标识符或提供了多个标识符）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Bad Request: missing identifier (phone, mail, or user_id)"
        '404':
          description: 用户未找到
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "User not found"
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/users:
    get:
      tags:
        - users
      summary: 获取用户列表（v1）
      description: 与 GET / 相同，版本化路径
      operationId: getUsersV1
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/AllowListUser'
                  - $ref: '#/components/schemas/PaginatedUsers'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/user:
    get:
      tags:
        - users
      summary: 查询单个用户（v1）
      description: 与 GET /user 相同，版本化路径
      operationId: getUserByIdentifierV1
      parameters:
        - name: phone
          in: query
          schema:
            type: string
        - name: mail
          in: query
          schema:
            type: string
            format: email
        - name: user_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllowListUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: 用户未找到
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/lookup:
    get:
      tags:
        - users
      summary: 用户查询（Stargate/Herald 集成）
      description: |
        根据单一 identifier 查询用户，返回 user_id、destination（email/phone）、status、channel_hint，
        便于 Stargate 选择 Herald 的 sms/email 通道。
        identifier 自动识别：含 @ 按邮箱查，否则先按手机再按 user_id。
      operationId: getLookup
      parameters:
        - name: identifier
          in: query
          required: true
          schema:
            type: string
          description: 手机号、邮箱或 user_id
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupResponse'
        '400':
          description: 缺少 identifier 或参数无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 用户未找到
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/health:
    get:
      security: []
      tags:
        - health
      summary: 健康检查（v1）
      description: 与 GET /health 相同
      operationId: healthCheckV1
      responses:
        '200':
          description: 服务健康
        '503':
          description: 服务不可用

  /v1/healthcheck:
    get:
      security: []
      tags:
        - health
      summary: 健康检查别名（v1）
      description: 与 GET /healthcheck 相同
      operationId: healthCheckAliasV1
      responses:
        '200':
          $ref: '#/paths/~1health/get/responses/200'
        '503':
          $ref: '#/paths/~1health/get/responses/503'

  /metrics:
    get:
      security: []
      tags:
        - system
      summary: Prometheus 指标
      description: 默认匿名返回 Prometheus 指标；设置 WARDEN_METRICS_REQUIRE_AUTH=true 后使用全局认证方案。
      operationId: getMetrics
      responses:
        '200':
          description: 成功返回指标数据
          content:
            text/plain:
              schema:
                type: string
              example: |
                  # HELP http_requests_total Total number of HTTP requests
                  # TYPE http_requests_total counter
                  http_requests_total{method="GET",path="/"} 1000
                  # HELP cache_size Current cache size
                  # TYPE cache_size gauge
                  cache_size 100

components:
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
    HMACSignature:
      type: apiKey
      in: header
      name: X-Signature
      description: Hex-encoded HMAC-SHA256 signature over the v2 canonical request.
    HMACTimestamp:
      type: apiKey
      in: header
      name: X-Timestamp
    HMACKeyID:
      type: apiKey
      in: header
      name: X-Key-Id
      description: Key identifier included in the signed v2 canonical request.
    HMACNonce:
      type: apiKey
      in: header
      name: X-Nonce
      description: Unique 128-bit hexadecimal nonce used for replay rejection.
    HMACVersion:
      type: apiKey
      in: header
      name: X-Signature-Version
      description: Must be v2. Legacy v1 is disabled by default.
    MutualTLS:
      type: mutualTLS

  schemas:
    AllowListUser:
      type: object
      description: 至少提供 phone 或 mail 之一；支持仅邮箱用户（phone 可为空）
      properties:
        phone:
          type: string
          description: 用户手机号（与 mail 二选一或同时提供；支持仅邮箱用户时为空）
          example: "13800138000"
        mail:
          type: string
          format: email
          description: 用户邮箱（与 phone 二选一或同时提供）
          example: "admin@example.com"
        user_id:
          type: string
          description: 用户唯一标识符（可选，如果未提供则自动生成）
          example: "a1b2c3d4e5f6g7h8"
        status:
          type: string
          description: 用户状态（如 "active", "inactive", "suspended"）
          enum:
            - active
            - inactive
            - suspended
          default: "inactive"
          example: "inactive"
        scope:
          type: array
          description: 用户权限范围（可选）
          items:
            type: string
          example: ["read", "write"]
        role:
          type: string
          description: 用户角色（可选）
          example: "admin"
        name:
          type: string
          description: 用户显示名称（可选）
          example: "管理员"

    LookupResponse:
      type: object
      description: GET /v1/lookup 响应（Stargate/Herald 集成）
      properties:
        user_id:
          type: string
          description: 用户唯一标识
        destination:
          type: object
          properties:
            email:
              type: string
              description: 邮箱（可选）
            phone:
              type: string
              description: 手机号（可选）
        status:
          type: string
          description: 用户状态
        channel_hint:
          type: string
          enum: ["sms", "email"]
          description: OTP 推荐通道
        name:
          type: string
          description: 用户显示名称（可选，数据源有则返回）

    PaginatedUsers:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AllowListUser'
          description: 用户数据列表
        pagination:
          type: object
          required:
            - page
            - page_size
            - total
            - total_pages
          properties:
            page:
              type: integer
              description: 当前页码
              example: 1
            page_size:
              type: integer
              description: 每页大小
              example: 100
            total:
              type: integer
              description: 总记录数
              example: 200
            total_pages:
              type: integer
              description: 总页数
              example: 2

    HealthCheckResponse:
      type: object
      required:
        - status
        - service
      properties:
        status:
          type: string
          description: 健康状态
          enum:
            - ok
            - degraded
            - unhealthy
          example: "ok"
        service:
          type: string
          example: "warden"
        checks:
          type: object
          description: 各项检查结果；production 环境不返回
          additionalProperties:
            $ref: '#/components/schemas/HealthCheckResult'
        timestamp:
          type: string
          format: date-time
        total_latency_ms:
          type: integer
          format: int64
          minimum: 0

    HealthCheckResult:
      type: object
      required:
        - name
        - status
        - latency_ms
        - timestamp
      properties:
        name:
          type: string
        status:
          type: string
          enum: [ok, degraded, unhealthy, disabled, unknown]
        latency_ms:
          type: integer
          format: int64
          minimum: 0
        message:
          type: string
        error:
          type: string
        timestamp:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties: true

    LogLevelRequest:
      type: object
      required:
        - level
      properties:
        level:
          type: string
          description: 日志级别
          enum:
            - trace
            - debug
            - info
            - warn
            - error
            - fatal
            - panic
          example: "debug"

    LogLevelResponse:
      type: object
      required:
        - level
      properties:
        level:
          type: string
          description: 当前日志级别
          example: "info"

    LogLevelUpdateResponse:
      type: object
      required:
        - message
        - level
      properties:
        message:
          type: string
          description: 操作结果消息
          example: "日志级别已更新"
        level:
          type: string
          description: 更新后的日志级别
          example: "debug"

    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: 错误消息
          example: "Invalid pagination parameters"

  responses:
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Invalid pagination parameters"

    MethodNotAllowed:
      description: 不支持的 HTTP 方法
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Method not allowed"

    InternalServerError:
      description: 服务器内部错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Internal server error"
