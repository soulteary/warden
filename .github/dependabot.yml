# Dependabot：自动更新依赖与 GitHub Actions。
# 配合"高保证场景将第三方 Action 固定到 commit SHA"的建议：
# 将 workflow 中的 action 固定为 SHA 后，Dependabot 仍可自动升级并更新 SHA。
# 仓库当前未定义自定义标签，因此不在更新规则中声明 labels，避免每个 PR
# 都产生 "labels could not be found" 告警。
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/example/advanced/mock-api"
    schedule:
      interval: "weekly"
