name: Recover exact Warden 1.6.3 owned draft

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Read-only plan, or exact bound recovery (requires reviewed Root evidence)'
        required: true
        default: plan
        type: choice
        options:
          - plan
          - inspect-partial
          - recover

concurrency:
  group: release-version-soulteary/warden-v1.6.3
  cancel-in-progress: false

permissions:
  contents: read

env:
  RECOVERY_NAME: warden163-owned-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  plan:
    if: inputs.operation == 'plan' || inputs.operation == 'inspect-partial'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      # GitHub requires push access to observe this owned draft. Client is GET-only.
      contents: write
    steps:
      - name: Checkout reviewed recovery tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: recovery-tools
          persist-credentials: false
      - name: Install fixed public signature verifier
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
          install-dir: ${{ runner.temp }}/warden163-cosign
      - name: Observe exact attempt and output safe dry-plan
        env:
          OPERATION: ${{ inputs.operation }}
          GH_TOKEN: ${{ github.token }}
        run: |
          PHASE=plan
          if [ "$OPERATION" = "inspect-partial" ]; then PHASE=inspect-partial; fi
          python3 -I -B recovery-tools/scripts/warden163_recovery/recover.py \
            --phase "$PHASE" --output "$RUNNER_TEMP/$RECOVERY_NAME"
      - name: Retain safe plan only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: warden163-owned-dry-plan-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/${{ env.RECOVERY_NAME }}/safe-report-plan.json
            ${{ runner.temp }}/${{ env.RECOVERY_NAME }}/safe-report-inspect-partial.json
          if-no-files-found: warn

  recover:
    if: inputs.operation == 'recover'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: write
      # No packages or id-token write permission: the existing image is preserved.
    steps:
      - name: Checkout reviewed recovery tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: recovery-tools
          persist-credentials: false
      - name: Checkout exact original business source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 6fe54f24f78c28225882c2aae779e1020bb8f87e
          fetch-depth: 0
          path: original-source
          persist-credentials: false
      - name: Install fixed public signature verifier
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
          install-dir: ${{ runner.temp }}/warden163-cosign
      - name: Require bound Root image qualification and exact live attempt before build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I -B recovery-tools/scripts/warden163_recovery/recover.py \
            --phase plan --require-authorization --output "$RUNNER_TEMP/$RECOVERY_NAME"
      - name: Select exact original compiler
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Rebuild six unpublished standalone assets from original source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I -B recovery-tools/scripts/warden163_recovery/recover.py \
            --phase rebuild --source "$GITHUB_WORKSPACE/original-source" --output "$RUNNER_TEMP/$RECOVERY_NAME"
      - name: Regenerate SBOM from exact preserved index without automatic uploads
        env:
          SYFT_PLATFORM: linux/amd64
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: registry:ghcr.io/soulteary/warden@sha256:9ac7db4184d922ddaadfa99f9e65a59e88641f08181f6eab83a57c19a9e3234c
          syft-version: v1.51.1
          format: spdx-json
          output-file: ${{ runner.temp }}/${{ env.RECOVERY_NAME }}/artifacts/warden-image-sbom.spdx.json
          dependency-snapshot: false
          upload-artifact: false
          upload-release-assets: false
      - name: Revalidate exact empty draft then upload eight literal assets and publish only its ID
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I -B recovery-tools/scripts/warden163_recovery/recover.py \
            --phase upload --output "$RUNNER_TEMP/$RECOVERY_NAME"
      - name: Retain only bounded safe recovery reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: warden163-owned-recovery-reports-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/${{ env.RECOVERY_NAME }}/safe-report-plan.json
            ${{ runner.temp }}/${{ env.RECOVERY_NAME }}/safe-report-rebuild.json
            ${{ runner.temp }}/${{ env.RECOVERY_NAME }}/safe-report-upload.json
          if-no-files-found: warn
