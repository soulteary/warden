name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  DOCKER_BUILDKIT: 1

jobs:
  # 代码格式检查
  fmt:
    name: 代码格式检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 设置 Go 环境
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: 检查代码格式
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "以下文件格式不正确:"
            gofmt -s -d .
            exit 1
          fi

  # 代码静态检查
  vet:
    name: 代码静态检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 设置 Go 环境
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: 下载依赖
        run: go mod download

      - name: 运行 go vet
        run: go vet ./...

  # 代码测试
  test:
    name: 代码测试
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS: localhost:6379
      REDIS_ENABLED: "true"
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 等待 Redis 就绪
        run: |
          echo "检查 Redis 连接..."
          for i in {1..30}; do
            if docker run --rm --network host redis:8-alpine redis-cli -h localhost -p 6379 ping 2>/dev/null | grep -q PONG; then
              echo "Redis 已就绪"
              exit 0
            fi
            echo "等待 Redis 启动... ($i/30)"
            sleep 1
          done
          echo "Redis 启动超时"
          exit 1

      # 该 action 自行安装 Go、运行测试、统计覆盖率并执行阈值门禁，
      # 同时产出 Markdown 报告、SVG 徽章与 JSON。此处 commit 为 false：
      # PR 分支只校验不回写，标签/手动回写由 go-quality-reports.yml 的独立 job 完成。
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Branch tests and coverage gate
        run: |-
          go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...
          ci_floor=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/,"",$3); print $3}')
          awk -v t="$ci_floor" 'BEGIN {exit !(t+0 >= 80)}'
        if: "!(github.event_name == 'pull_request')"
      - name: Remove stale generated report evidence
        if: always() && (github.event_name == 'pull_request')
        shell: bash
        run: |
          set -euo pipefail
          test ! -L .github
          rm -f -- .github/go-test-report.md .github/go-test-report.json .github/coverage.svg .github/goreportcard.svg .github/goreportcard-report.md
          rm -rf -- .github/test-results
      - name: Test, race and coverage (GTR v1.1.2)
        id: go_test_report
        uses: soulteary/go-test-report-action@bf04b539f7bf2a6f67d602da4259904b3dcdeba1  # v1.1.2
        with:
          directory: "."
          packages: "./..."
          race: "true"
          coverage_threshold: "80"
          test_args: "-count=1"
          version: "v1.1.2"
          cover_mode: "atomic"
          commit: "false"
        if: github.event_name == 'pull_request'
      - name: Go quality report (v1.1.3)
        id: go_report_card
        uses: soulteary/goreportcard-action@fc43049a5fe61c3313294d217c2a783f375a7970  # v1.1.3
        with:
          directory: "."
          version: "v1.1.3"
          threshold: "0"
          report: "true"
          commit: "false"
        if: always() && github.event_name == 'pull_request'
      - name: Reuse GTR coverage profile
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PROFILE: ${{ steps.go_test_report.outputs.coverage_profile }}
        run: |-
          cp "$PROFILE" coverage.out
      - name: 显示测试摘要
        if: (always()) && (github.event_name == 'pull_request')
        run: |
          echo "状态: ${{ steps.go_test_report.outputs.status }}"
          echo "覆盖率: ${{ steps.go_test_report.outputs.coverage }}%（门槛 80%）"
          echo "用例: 共 ${{ steps.go_test_report.outputs.tests }}，通过 ${{ steps.go_test_report.outputs.passed }}，失败 ${{ steps.go_test_report.outputs.failed }}，跳过 ${{ steps.go_test_report.outputs.skipped }}"

      - name: 上传测试报告
        if: (always()) && (github.event_name == 'pull_request')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-test-report-${{ github.run_id }}
          path: |
            .github/go-test-report.md
            .github/go-test-report.json
            .github/coverage.svg
            .github/goreportcard.svg
            .github/goreportcard-report.md
            .github/test-results/
          retention-days: 14

  # 代码质量检查（使用 golangci-lint）
          include-hidden-files: true
    permissions:
      contents: read
  lint:
    name: 代码质量检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 设置 Go 环境
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: 运行 golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.14.0
          args: --timeout=5m
          only-new-issues: false


  # 依赖项安全扫描
  security-scan:
    name: 依赖项安全扫描
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 设置 Go 环境
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: 下载依赖
        run: go mod download

      - name: 安装 govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: 运行安全扫描
        run: govulncheck ./...

  # Docker 构建
  docker-build:
    name: Docker 构建
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4

      - name: 获取版本信息
        id: version
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "dev-$(git rev-parse --short HEAD)")
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +%FT%T%z)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT
          echo "build_date=$BUILD_DATE" >> $GITHUB_OUTPUT
          echo "最近版本: $VERSION / $COMMIT"

      - name: 构建 Docker 镜像
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          load: true
          tags: warden:test
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ steps.version.outputs.commit }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 验证镜像
        run: |
          docker images warden:test
          docker inspect warden:test

      # 校验运行阶段以非 root 用户运行（阶段六容器加固回归测试）
      - name: 校验非 root 运行
        run: |
          UID_IN_IMAGE=$(docker inspect --format '{{.Config.User}}' warden:test)
          echo "镜像配置用户: ${UID_IN_IMAGE}"
          if [ "${UID_IN_IMAGE}" != "10001:10001" ]; then
            echo "::error::镜像必须以固定用户 10001:10001 运行"
            exit 1
          fi

      # 容器镜像漏洞扫描（Trivy）；发现 HIGH/CRITICAL 漏洞则失败
      - name: 容器镜像漏洞扫描
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: warden:test
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          scanners: vuln
          version: v0.74.0
          token-setup-trivy: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传 Trivy 扫描结果
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-image-sarif
          path: trivy-image.sarif

      # 生成 SBOM（软件物料清单，SPDX 格式）
      - name: 生成 SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: warden:test
          format: spdx-json
          output-file: warden-sbom.spdx.json

      - name: 上传 SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: warden-sbom
          path: warden-sbom.spdx.json

  # 完整构建检查
  build:
    name: 构建检查
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 设置 Go 环境
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: 下载依赖
        run: go mod download

      - name: 构建项目
        run: go build -v -o warden${{ matrix.os == 'windows-latest' && '.exe' || '' }} .

      - name: 验证构建产物
        if: matrix.os == 'ubuntu-latest'
        run: |
          if [ -f warden ]; then
            echo "构建成功，文件存在"
            ls -lh warden
            file warden
          else
            echo "构建失败，文件不存在"
            exit 1
          fi
