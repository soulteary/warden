name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  DOCKER_BUILDKIT: 1

jobs:
  # 代码格式检查
  fmt:
    name: 代码格式检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 设置 Go 环境
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: 检查代码格式
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "以下文件格式不正确:"
            gofmt -s -d .
            exit 1
          fi

  # 代码静态检查
  vet:
    name: 代码静态检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 设置 Go 环境
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: 下载依赖
        run: go mod download

      - name: 运行 go vet
        run: go vet ./...

  # 代码测试
  test:
    name: 代码测试
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS: localhost:6379
      REDIS_ENABLED: "true"
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 设置 Go 环境
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: 下载依赖
        run: go mod download

      - name: 等待 Redis 就绪
        run: |
          echo "检查 Redis 连接..."
          for i in {1..30}; do
            if docker run --rm --network host redis:8-alpine redis-cli -h localhost -p 6379 ping 2>/dev/null | grep -q PONG; then
              echo "Redis 已就绪"
              exit 0
            fi
            echo "等待 Redis 启动... ($i/30)"
            sleep 1
          done
          echo "Redis 启动超时"
          exit 1

      - name: 运行测试
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: 生成覆盖率报告
        run: go tool cover -html=coverage.out -o coverage.html

      - name: 上传覆盖率报告
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage.html

      - name: 显示覆盖率摘要
        run: go tool cover -func=coverage.out

      - name: 检查覆盖率门槛
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')
          awk -v coverage="${COVERAGE}" 'BEGIN { if (coverage + 0 < 80) { printf "coverage %.1f%% is below 80%%\n", coverage; exit 1 } }'

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # 代码质量检查（使用 golangci-lint）
  lint:
    name: 代码质量检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 设置 Go 环境
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: 运行 golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.1
          args: --timeout=5m
          only-new-issues: false


  # 依赖项安全扫描
  security-scan:
    name: 依赖项安全扫描
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 设置 Go 环境
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: 下载依赖
        run: go mod download

      - name: 安装 govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: 运行安全扫描
        run: govulncheck ./...

  # Docker 构建
  docker-build:
    name: Docker 构建
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: 获取版本信息
        id: version
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "dev-$(git rev-parse --short HEAD)")
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +%FT%T%z)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT
          echo "build_date=$BUILD_DATE" >> $GITHUB_OUTPUT
          echo "最近版本: $VERSION / $COMMIT"

      - name: 构建 Docker 镜像
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          load: true
          tags: warden:test
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ steps.version.outputs.commit }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 验证镜像
        run: |
          docker images warden:test
          docker inspect warden:test

      # 校验运行阶段以非 root 用户运行（阶段六容器加固回归测试）
      - name: 校验非 root 运行
        run: |
          UID_IN_IMAGE=$(docker inspect --format '{{.Config.User}}' warden:test)
          echo "镜像配置用户: ${UID_IN_IMAGE}"
          if [ "${UID_IN_IMAGE}" = "" ] || [ "${UID_IN_IMAGE}" = "root" ] || [ "${UID_IN_IMAGE}" = "0" ] || [ "${UID_IN_IMAGE}" = "0:0" ]; then
            echo "::error::镜像必须以非 root 用户运行"
            exit 1
          fi

      # 容器镜像漏洞扫描（Trivy）；发现 HIGH/CRITICAL 漏洞则失败
      - name: 容器镜像漏洞扫描
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: warden:test
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: 上传 Trivy 扫描结果
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-image-sarif
          path: trivy-image.sarif

      # 生成 SBOM（软件物料清单，SPDX 格式）
      - name: 生成 SBOM
        uses: anchore/sbom-action@aa80c8c5bd439a416a62804f2151ab38c671a638 # v0.24.1
        with:
          image: warden:test
          format: spdx-json
          output-file: warden-sbom.spdx.json

      - name: 上传 SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: warden-sbom
          path: warden-sbom.spdx.json

  # 完整构建检查
  build:
    name: 构建检查
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 设置 Go 环境
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: 下载依赖
        run: go mod download

      - name: 构建项目
        run: go build -v -o warden${{ matrix.os == 'windows-latest' && '.exe' || '' }} .

      - name: 验证构建产物
        if: matrix.os == 'ubuntu-latest'
        run: |
          if [ -f warden ]; then
            echo "构建成功，文件存在"
            ls -lh warden
            file warden
          else
            echo "构建失败，文件不存在"
            exit 1
          fi
