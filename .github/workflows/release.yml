name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: '手动发布/覆盖的已存在 v* tag（例如 v1.2.3）'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write # keyless cosign 签名（OIDC）所需

    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: 解析发布 tag
        id: release
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${INPUT_RELEASE_TAG}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if ! printf '%s' "${TAG}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "::error::release_tag 必须是形如 vX.Y.Z 的语义化 tag，实际为 '${TAG}'"
            exit 1
          fi
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            git rev-parse --verify "refs/tags/${TAG}^{commit}" >/dev/null
            test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/${TAG}^{commit}")"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "manual=${{ github.event_name == 'workflow_dispatch' }}" >> "$GITHUB_OUTPUT"

      - name: 设置 Go 环境
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: 'go.mod'

      - name: 缓存 Go 模块
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: 下载依赖
        run: go mod download

      - name: 运行测试
        run: go test -v -race ./...

      - name: 提取版本信息
        id: version
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          VERSION=${TAG#v}
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +%FT%T%z)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT
          echo "build_date=$BUILD_DATE" >> $GITHUB_OUTPUT

      - name: 构建多平台二进制文件
        run: |
          mkdir -p dist
          VERSION=${{ steps.version.outputs.version }}
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +%FT%T%z)
          LDFLAGS="-s -w -X github.com/soulteary/version-kit/v2.Version=${VERSION} -X github.com/soulteary/version-kit/v2.Commit=${COMMIT} -X github.com/soulteary/version-kit/v2.BuildDate=${BUILD_DATE}"

          # 构建多个平台
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "${LDFLAGS}" -o dist/warden-linux-amd64 .
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "${LDFLAGS}" -o dist/warden-linux-arm64 .
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "${LDFLAGS}" -o dist/warden-darwin-amd64 .
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "${LDFLAGS}" -o dist/warden-darwin-arm64 .
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "${LDFLAGS}" -o dist/warden-windows-amd64.exe .
          GOOS=windows GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "${LDFLAGS}" -o dist/warden-windows-arm64.exe .

      - name: 生成校验和
        run: |
          cd dist
          # 排除 checksums.txt 自身:`sha256sum *` 可能把清单文件本身纳入清单
          # （生成一行自引用记录，其哈希与最终文件永不匹配），导致之后
          # `sha256sum -c` 报 "checksums.txt: FAILED"。只对清单以外的产物求哈希。
          sha256sum $(ls | grep -v '^checksums.txt$') > checksums.txt

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: 登录到容器注册表
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取元数据
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # 手动触发时 github.ref 为分支，无法从 ref 解析 tag，
          # 因此统一使用 解析发布 tag 步骤得到的 tag/version 生成别名。
          tags: |
            type=semver,pattern={{version}},value=${{ steps.release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.tag }}
            type=semver,pattern={{major}},value=${{ steps.release.outputs.tag }}
            type=raw,value=latest,enable=${{ !contains(steps.release.outputs.tag, '-') }}

      - name: 构建并推送 Docker 镜像
        id: build-push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ steps.version.outputs.commit }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      # 生成容器镜像 SBOM 并随 Release 一并发布
      - name: 生成容器 SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-push.outputs.digest }}
          format: spdx-json
          output-file: dist/warden-image-sbom.spdx.json

      # keyless cosign 签名（基于 OIDC，无需长期私钥）
      - name: 安装 cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: 签名容器镜像（keyless）
        env:
          COSIGN_EXPERIMENTAL: "1"
          DIGEST: ${{ steps.build-push.outputs.digest }}
        run: |
          cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      # 为镜像重新生成校验和（含新增 SBOM），确保 checksums.txt 覆盖全部产物
      - name: 重新生成校验和
        run: |
          cd dist
          sha256sum $(ls | grep -v '^checksums.txt$') > checksums.txt
          cat checksums.txt

      - name: 验证发布产物校验和
        run: |
          cd dist
          sha256sum -c checksums.txt

      - name: 覆盖前删除已存在的 Release
        if: steps.release.outputs.manual == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          # 手动重发：删除同名 Release（保留 git tag），随后重新创建以覆盖。
          gh release delete "$TAG" --yes --repo "$GITHUB_REPOSITORY" || true

      - name: 创建 Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*
          tag_name: ${{ steps.release.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body: |
            ## Changes

            See [CHANGELOG](CHANGELOG.md) for details.

            ## Downloads

            ### Docker Image
            ```bash
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
            ```

            ### Binaries
            - Linux AMD64: `warden-linux-amd64`
            - Linux ARM64: `warden-linux-arm64`
            - macOS AMD64: `warden-darwin-amd64`
            - macOS ARM64: `warden-darwin-arm64`
            - Windows AMD64: `warden-windows-amd64.exe`
            - Windows ARM64: `warden-windows-arm64.exe`

            ### Checksums
            See `checksums.txt` for SHA256 checksums.

            ### Supply-chain 安全
            - 容器镜像已使用 keyless cosign 签名，可验证：
              ```bash
              cosign verify ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }} \
                --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com
              ```
            - SBOM（SPDX）：`warden-image-sbom.spdx.json`
          draft: false
          prerelease: false
