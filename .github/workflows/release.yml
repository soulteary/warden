name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: '仅发布尚无 Release/版本镜像的已存在 v* tag（例如 v1.2.3）'
        required: true
        type: string

# Serialize this workflow for the exact version, including manual/tag triggers.
concurrency:
  group: release-version-${{ github.repository }}-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write # keyless cosign 签名（OIDC）所需

    defaults:
      run:
        working-directory: release-source

    steps:
      # Guard code follows the workflow revision, even for an older manual tag.
      - name: Checkout release tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tools
          persist-credentials: false

      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: release-source
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: 解析发布 tag
        id: release
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${INPUT_RELEASE_TAG}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if ! printf '%s' "${TAG}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "::error::release_tag must be a valid vX.Y.Z version tag"
            exit 1
          fi
          test "$GITHUB_REPOSITORY" = "soulteary/warden"
          SOURCE_REVISION=$(git rev-parse --verify 'HEAD^{commit}')
          TAG_REVISION=$(git rev-parse --verify "refs/tags/${TAG}^{commit}")
          test "$SOURCE_REVISION" = "$TAG_REVISION"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            test "$SOURCE_REVISION" = "$GITHUB_SHA"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "source_revision=${SOURCE_REVISION}" >> "$GITHUB_OUTPUT"

      - name: Reject existing release versions before build
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          SOURCE_REVISION: ${{ steps.release.outputs.source_revision }}
        run: |
          python3 -I -B ../release-tools/scripts/release_version_guard.py \
            --tag "$RELEASE_TAG" --source-revision "$SOURCE_REVISION"

      - name: 设置 Go 环境
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'release-source/go.mod'

      - name: 缓存 Go 模块
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('release-source/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: 下载依赖
        run: go mod download

      - name: 运行测试
        run: go test -v -race ./...

      - name: 提取版本信息
        id: version
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          VERSION=${TAG#v}
          COMMIT="${{ steps.release.outputs.source_revision }}"
          BUILD_DATE=$(date -u +%FT%T%z)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT
          echo "build_date=$BUILD_DATE" >> $GITHUB_OUTPUT

      - name: 构建多平台二进制文件
        run: |
          mkdir -p dist
          VERSION=${{ steps.version.outputs.version }}
          COMMIT="${{ steps.version.outputs.commit }}"
          BUILD_DATE="${{ steps.version.outputs.build_date }}"
          LDFLAGS="-s -w -X github.com/soulteary/version-kit/v4.Version=${VERSION} -X github.com/soulteary/version-kit/v4.Commit=${COMMIT} -X github.com/soulteary/version-kit/v4.BuildDate=${BUILD_DATE}"

          # 构建多个平台
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "${LDFLAGS}" -o dist/warden-linux-amd64 .
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "${LDFLAGS}" -o dist/warden-linux-arm64 .
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "${LDFLAGS}" -o dist/warden-darwin-amd64 .
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "${LDFLAGS}" -o dist/warden-darwin-arm64 .
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "${LDFLAGS}" -o dist/warden-windows-amd64.exe .
          GOOS=windows GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "${LDFLAGS}" -o dist/warden-windows-arm64.exe .

      - name: 生成校验和
        run: |
          cd dist
          # 排除 checksums.txt 自身:`sha256sum *` 可能把清单文件本身纳入清单
          # （生成一行自引用记录，其哈希与最终文件永不匹配），导致之后
          # `sha256sum -c` 报 "checksums.txt: FAILED"。只对清单以外的产物求哈希。
          sha256sum $(ls | grep -v '^checksums.txt$') > checksums.txt

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4

      - name: 登录到容器注册表
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取元数据
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # 手动触发时 github.ref 为分支，无法从 ref 解析 tag，
          # 因此统一使用 解析发布 tag 步骤得到的 tag/version 生成别名。
          tags: |
            type=semver,pattern={{version}},value=${{ steps.release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.tag }}
            type=semver,pattern={{major}},value=${{ steps.release.outputs.tag }}
            type=raw,value=latest,enable=${{ !contains(steps.release.outputs.tag, '-') }}

      - name: Recheck version absence immediately before registry publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          SOURCE_REVISION: ${{ steps.release.outputs.source_revision }}
        run: |
          python3 -I -B ../release-tools/scripts/release_version_guard.py \
            --tag "$RELEASE_TAG" --source-revision "$SOURCE_REVISION"

      - name: 构建并推送 Docker 镜像
        id: build-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./release-source
          file: ./release-source/docker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/soulteary/warden
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.created=${{ steps.version.outputs.build_date }}
            org.opencontainers.image.revision=${{ steps.release.outputs.source_revision }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ steps.version.outputs.commit }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      # 生成容器镜像 SBOM 并随 Release 一并发布
      - name: 生成容器 SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-push.outputs.digest }}
          format: spdx-json
          output-file: release-source/dist/warden-image-sbom.spdx.json

      # keyless cosign 签名（基于 OIDC，无需长期私钥）
      - name: 安装 cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: 签名容器镜像（keyless）
        env:
          COSIGN_EXPERIMENTAL: "1"
          DIGEST: ${{ steps.build-push.outputs.digest }}
        run: |
          cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      # 为镜像重新生成校验和（含新增 SBOM），确保 checksums.txt 覆盖全部产物
      - name: 重新生成校验和
        run: |
          cd dist
          sha256sum $(ls | grep -v '^checksums.txt$') > checksums.txt
          cat checksums.txt

      - name: 验证发布产物校验和
        run: |
          cd dist
          sha256sum -c checksums.txt

      - name: Create release only; never update or replace an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          SOURCE_REVISION: ${{ steps.release.outputs.source_revision }}
        run: |
          set -euo pipefail
          # POST /releases is create-only. A race/collision fails; no delete,
          # adoption, PATCH of an existing release, or clobber upload is allowed.
          python3 - "$RELEASE_TAG" "$SOURCE_REVISION" > release-create.json <<'PY_CREATE'
          import json, pathlib, sys
          tag, source = sys.argv[1:]
          notes = pathlib.Path('docs/releases') / (tag + '.md')
          body = notes.read_text() if notes.is_file() else 'See CHANGELOG.md at ' + source
          print(json.dumps(dict(tag_name=tag, target_commitish=source,
              name='Release ' + tag, body=body, draft=True, prerelease=False)))
          PY_CREATE
          # pipefail propagates either gh failure or strict parser refusal.
          # The parser reads at most 1 MiB + 1, requires explicit HTTP 201 and
          # emits only a validated ID. No arbitrary successful 2xx is creation.
          RELEASE_ID=$(gh api --include --method POST "repos/$GITHUB_REPOSITORY/releases" \
            --input release-create.json | \
            python3 -I -B ../release-tools/scripts/release_created_id.py --tag "$RELEASE_TAG")
          # Fixed outputs only; POST asset collisions fail without replacement.
          for name in warden-linux-amd64 warden-linux-arm64 warden-darwin-amd64 warden-darwin-arm64 warden-windows-amd64.exe warden-windows-arm64.exe warden-image-sbom.spdx.json checksums.txt; do
            test -f "dist/$name"
            gh api --method POST -H 'Content-Type: application/octet-stream' \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$name" \
              --input "dist/$name" > /dev/null
          done
          # Finalize only the ID returned by this invocation's successful POST.
          printf '{"draft":false}\n' > release-publish.json
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            --input release-publish.json > /dev/null

  report_release:
    name: Dispatch verified release reports
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Request reports for the released tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh workflow run go-quality-reports.yml --repo "$REPOSITORY" --ref "$DEFAULT_BRANCH" \
            -f "source_ref=refs/tags/$RELEASE_TAG" -f reuse_existing_tag_report=true
