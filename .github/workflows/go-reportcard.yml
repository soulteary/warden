name: Go Report Card

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: grc
        uses: soulteary/goreportcard-action@9480215498804c431e4561b4d3e50d925e16b9bd # v1.1.0
        with:
          directory: "."
          output: ".github/goreportcard.svg"
          commit: "true"
      - run: echo "Grade ${{ steps.grc.outputs.grade }} (${{ steps.grc.outputs.score }}%)"
