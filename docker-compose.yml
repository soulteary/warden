services:

  warden:
    restart: always
    image: ${WARDEN_IMAGE:-ghcr.io/soulteary/warden:latest}
    container_name: warden
    # Warden is an internal identity directory. Public traffic must enter through
    # the gateway service; do not publish this port on the Docker host.
    expose:
      - 8081
    networks:
      - auth-internal
      - warden-data
    env_file:
      - ./.env
    environment:
      - PORT=${PORT}
      - REDIS=${REDIS:-warden-redis:6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:?set REDIS_PASSWORD in .env before starting Warden}
      - CONFIG=${CONFIG}
      - KEY=${KEY}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - API_KEY=${API_KEY:?set API_KEY in .env before starting Warden}
      - SNAPSHOT_READ_POLICY=${SNAPSHOT_READ_POLICY:-enforce}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./data.json:/app/data.json:ro
    healthcheck:
      # Follows PORT; 8081 is the port Warden listens on when PORT is unset.
      test: ["CMD-SHELL", "curl --fail http://localhost:${PORT:-8081}/healthcheck || exit 1"]
      interval: 10s
      timeout: 1s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "1m"

  warden-redis:
    container_name: warden-redis
    # 默认 legacy 模式保留原缓存格式；V2 快照还使用 Lua 与租约，不能按基础命令推断兼容性。
    # 当前快照集成验证使用 Redis 8；启用 V2 前按迁移文档验证部署版本。
    image: redis:7.4-alpine
    # Redis port configuration: expose only, not mapped to host
    # Purpose: Redis cache for Warden service, used only within Docker internal network
    # Benefit: Avoids port conflicts with host or other services (e.g., herald's Redis mapped to host 6379)
    expose:
      - 6379
    networks:
      - warden-data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env before starting Warden}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env before starting Warden}"]
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping']
      interval: 10s
      timeout: 1s
      retries: 3

networks:
  # A gateway such as Stargate can join this named network from its own stack.
  # The bridge remains unexposed while retaining outbound access for remote rules.
  auth-internal:
    name: auth-internal
    driver: bridge

  # Redis is reachable only from Warden; the gateway joins auth-internal.
  warden-data:
    internal: true
